steps:
  # Step 0: Env vars
  - name: 'node:16'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Setting env vars"
        export ENV1=testing_env_var
        echo "Env var:"
        echo $ENV1
    id: 'Install dependencies'
  # Step 1: Install dependencies
  - name: 'node:16'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Installing dependencies"
        npm install
        echo "Env var:"
        echo $ENV1
    id: 'Install dependencies'

  # Step 2: Run linter
  - name: 'node:16'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Running linter"
        npm run lint
    id: 'Run linter'

  # Step 3: Run tests
  - name: 'node:16'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Running tests"
        npm run test:use-case
    id: 'Run tests'

  # Step 4: Build the application
  - name: 'node:16'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Building application"
        npm run build
    id: 'Build application'

